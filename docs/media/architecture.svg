<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="470" rx="18" fill="#0b1022"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <text x="32" y="44" fill="#f8fafc" font-size="20" font-weight="700">TrippAI architecture</text>
  <text x="32" y="66" fill="#94a3b8" font-size="13">Live mode calls the FastAPI service. The static demo build reads the same JSON, captured ahead of time.</text>

  <!-- data sources -->
  <g font-size="13">
    <rect x="32" y="100" width="190" height="62" rx="10" fill="#122033" stroke="#5eead4"/>
    <text x="48" y="126" fill="#5eead4" font-weight="700">Open-Meteo archive</text>
    <text x="48" y="146" fill="#cbd5e1">365 days of daily weather</text>
    <rect x="32" y="178" width="190" height="62" rx="10" fill="#1a1d3a" stroke="#a5b4fc"/>
    <text x="48" y="204" fill="#a5b4fc" font-weight="700">Google Trends</text>
    <text x="48" y="224" fill="#cbd5e1">search interest = crowds</text>
    <rect x="32" y="256" width="190" height="62" rx="10" fill="#2a2412" stroke="#f6c453"/>
    <text x="48" y="282" fill="#f6c453" font-weight="700">Price model</text>
    <text x="48" y="302" fill="#cbd5e1">seasonal, scaled by distance</text>
    <rect x="32" y="334" width="190" height="62" rx="10" fill="#2a1622" stroke="#fda4af"/>
    <text x="48" y="360" fill="#fda4af" font-weight="700">Event calendar</text>
    <text x="48" y="380" fill="#cbd5e1">festivals per city/month</text>
  </g>

  <!-- backend -->
  <rect x="272" y="96" width="330" height="304" rx="14" fill="#0f172a" stroke="#334155" stroke-dasharray="5 4"/>
  <text x="290" y="122" fill="#f8fafc" font-size="14" font-weight="700">trippai_ai  (FastAPI, Python)</text>
  <g font-size="13">
    <rect x="292" y="138" width="290" height="46" rx="9" fill="#1e293b"/>
    <text x="306" y="166" fill="#e2e8f0">ForecastService: merge daily → weekly</text>
    <rect x="292" y="196" width="290" height="46" rx="9" fill="#1e293b"/>
    <text x="306" y="224" fill="#e2e8f0">4 × Prophet (flat trend, yearly season)</text>
    <rect x="292" y="254" width="290" height="46" rx="9" fill="#1e293b"/>
    <text x="306" y="282" fill="#e2e8f0">Score 52 weeks: 0.4 price + 0.3 + 0.3</text>
    <rect x="292" y="312" width="290" height="46" rx="9" fill="#1e293b"/>
    <text x="306" y="340" fill="#e2e8f0">POST /api/predict  → best week + weekly[]</text>
  </g>
  <text x="292" y="386" fill="#64748b" font-size="12">scripts/export_demo.py snapshots this output</text>
  <path d="M437 184 V196 M437 242 V254 M437 300 V312" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M222 131 H292" stroke="#5eead4" stroke-width="1.5" marker-end="url(#a)" fill="none"/>
  <path d="M222 209 C255 209 260 170 292 166" stroke="#a5b4fc" stroke-width="1.5" marker-end="url(#a)" fill="none"/>
  <path d="M222 287 C258 287 256 172 292 172" stroke="#f6c453" stroke-width="1.5" marker-end="url(#a)" fill="none"/>
  <path d="M222 365 C258 365 262 340 292 336" stroke="#fda4af" stroke-width="1.5" marker-end="url(#a)" fill="none"/>

  <!-- json -->
  <rect x="632" y="196" width="120" height="104" rx="10" fill="#1c1a10" stroke="#f6c453" stroke-dasharray="4 3"/>
  <text x="648" y="224" fill="#f6c453" font-size="13" font-weight="700">public/demo/</text>
  <text x="648" y="246" fill="#cbd5e1" font-size="12">8 city snapshots</text>
  <text x="648" y="264" fill="#cbd5e1" font-size="12">+ multi-city.json</text>
  <text x="648" y="286" fill="#64748b" font-size="11">demo / Vercel</text>
  <path d="M602 335 H622 V270 H632" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <!-- frontend -->
  <rect x="782" y="96" width="150" height="304" rx="14" fill="#0f172a" stroke="#334155"/>
  <text x="798" y="122" fill="#f8fafc" font-size="14" font-weight="700">trippai (Next 15)</text>
  <g font-size="12" fill="#e2e8f0">
    <rect x="796" y="138" width="122" height="36" rx="8" fill="#1e293b"/><text x="808" y="161">Globe + planner</text>
    <rect x="796" y="182" width="122" height="36" rx="8" fill="#1e293b"/><text x="808" y="205">lib/trip.ts rescore</text>
    <rect x="796" y="226" width="122" height="36" rx="8" fill="#1e293b"/><text x="808" y="249">Heatmap, charts</text>
    <rect x="796" y="270" width="122" height="36" rx="8" fill="#1e293b"/><text x="808" y="293">Route map, cards</text>
    <rect x="796" y="314" width="122" height="36" rx="8" fill="#1e293b"/><text x="808" y="337">/multi-city (Mapbox)</text>
  </g>
  <path d="M602 318 C700 318 700 160 782 160" stroke="#5eead4" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="660" y="160" fill="#5eead4" font-size="11">live</text>
  <path d="M752 248 H782" stroke="#f6c453" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="32" y="438" fill="#94a3b8" font-size="12">The browser re-runs the weighting on weekly[] so changing priorities, trip length, window or budget updates instantly without another ~20 s model run.</text>
</svg>
