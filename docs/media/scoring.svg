<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="300" rx="18" fill="#0b1022"/>
  <text x="32" y="44" fill="#f8fafc" font-size="20" font-weight="700">How one week is scored</text>
  <text x="32" y="66" fill="#94a3b8" font-size="13">Each sub-score is 0-100 and normalised across the forecast year, so they are comparable.</text>
  <g font-size="13">
    <rect x="32" y="96" width="250" height="150" rx="12" fill="#2a2412" stroke="#f6c453"/>
    <text x="50" y="124" fill="#f6c453" font-weight="700">Price score</text>
    <text x="50" y="148" fill="#cbd5e1">(max − price) / (max − min)</text>
    <text x="50" y="170" fill="#94a3b8">cheapest week = 100</text>
    <rect x="50" y="200" width="214" height="10" rx="5" fill="#3b3420"/><rect x="50" y="200" width="190" height="10" rx="5" fill="#f6c453"/>

    <rect x="306" y="96" width="250" height="150" rx="12" fill="#122033" stroke="#5eead4"/>
    <text x="324" y="124" fill="#5eead4" font-weight="700">Weather score</text>
    <text x="324" y="148" fill="#cbd5e1">1 − |temp − 22°C| / 15</text>
    <text x="324" y="170" fill="#94a3b8">minus up to 20 for the wettest week</text>
    <rect x="324" y="200" width="214" height="10" rx="5" fill="#1d3440"/><rect x="324" y="200" width="160" height="10" rx="5" fill="#5eead4"/>

    <rect x="580" y="96" width="250" height="150" rx="12" fill="#1a1d3a" stroke="#a5b4fc"/>
    <text x="598" y="124" fill="#a5b4fc" font-weight="700">Crowd score</text>
    <text x="598" y="148" fill="#cbd5e1">(max − interest) / (max − min)</text>
    <text x="598" y="170" fill="#94a3b8">quietest week = 100</text>
    <rect x="598" y="200" width="214" height="10" rx="5" fill="#2a2e55"/><rect x="598" y="200" width="120" height="10" rx="5" fill="#a5b4fc"/>
  </g>
  <text x="286" y="178" fill="#f8fafc" font-size="22">+</text>
  <text x="560" y="178" fill="#f8fafc" font-size="22">+</text>
  <text x="838" y="160" fill="#f8fafc" font-size="22">=</text>
  <circle cx="900" cy="170" r="36" fill="none" stroke="#fb923c" stroke-width="6"/>
  <text x="900" y="178" fill="#f8fafc" font-size="22" font-weight="700" text-anchor="middle">86</text>
  <text x="32" y="276" fill="#94a3b8" font-size="12">Default weights 40 / 30 / 30 (same as the backend). A trip spanning k weeks averages k consecutive weeks; the top 3 non-overlapping windows are shown.</text>
</svg>
